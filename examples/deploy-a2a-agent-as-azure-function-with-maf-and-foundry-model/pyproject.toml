    "agent-framework>=1.11.0",
    "agent-framework-a2a>=1.0.0b260709",
    "agent-framework-foundry>=1.10.1",
    "azure-functions>=1.24.0",
    "azure-identity>=1.25.3",
    "python-dotenv>=1.2.2",
    "starlette>=1.3.1",
    "uvicorn>=0.51.0",
]
